<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Rider Login</title>

</head>
<body>
    <div class="container">
        <h1>Rider Login</h1>
        <p>Login To Your Rider Account</p>
        <form id="LoginForm">
            <fieldset>
                <legend>Login Information</legend>
                <table>
                    <tr>
                        <td>
                            <label for="riderEmail">Email</label>
                        </td>
                        <td>
                            <input type="email" id="riderEmail">
                            <p id="EmailError"></p>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="riderPassword">Password</label>
                        </td>
                        <td>
                            <input type="password" id="riderPassword">
                            <p id="PasswordError"></p>
                        </td>
                    </tr>
                </table>

                <br>
                <input type="submit" id="submit" value="Login">
                <input type="reset" id="reset" value="Reset">
            </fieldset>
        </form>

        <p>Don't have an account? <a href="registration.html">Register here</a></p>

    </div>
    <div class="footer">
        <h5>Created By Farhan Hasin Sijan</h5>
    </div>
</body>
</html>
